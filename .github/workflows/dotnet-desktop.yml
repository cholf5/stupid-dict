# CI / packaging pipeline
#
# Triggers and behavior:
#   - PR / push to main: tests only, on ubuntu + windows (pure doc changes like
#     **.md, LICENSE, docs/** do not trigger; tag pushes ignore paths filters
#     and always trigger). The windows leg covers what no other machine can:
#     the AutoStart registry helpers against a real HKCU, plus the
#     Windows-only file semantics recorded in AGENTS.md.
#   - tag v*: after tests pass, package — macOS .app (scripts/package.sh,
#     arm64+x64, self-contained), Windows win-x64 self-contained zip + Inno
#     Setup per-user installer (scripts/StupidDict.iss),
#     Linux linux-x64 zip — then create the GitHub Release and upload app
#     packages only. dictionary.zip / audio-pack.db are too big to build in
#     CI and live in their own prerelease (data-3, see ReleaseAssets.DataTag),
#     decoupled from app versions; the in-app first-run download pins to it.
#   - workflow_dispatch: manual packaging dry run (no release; artifacts on the run).
#
# Version convention: the release tag is vX.Y.Z and must equal the csproj
# <Version> of StupidDict.App (the comparison base of the in-app update
# check); scripts/release.sh bumps the csproj before tagging, and CI rejects
# a tag that disagrees.
#
# Asset naming contract (five assets + five checksum sidecars):
# StupidDict-{version}-{rid}.zip with rid ∈ {osx-arm64, osx-x64, win-x64,
# linux-x64}, plus the Windows installer
# StupidDict-{version}-win-x64-setup.exe, plus one <asset>.sha256 per asset
# (sha256sum format). The in-app updater
# (src/StupidDict.App/Update/UpdateAssets.cs) downloads by exactly these names
# — renaming assets here breaks "下载更新" for every installed client, and
# picking the wrong one for installed copies breaks silent upgrades. The
# sidecars are mandatory: self-update refuses to replace files it cannot
# verify, because the download mirrors are third-party proxies.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc-only changes do not trigger tests. Path filters are not evaluated
    # for tag pushes (per GitHub docs), so sharing this block with tags is safe.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  APP_PROJECT: src/StupidDict.App/StupidDict.App.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      # csproj <Version>, used by the packaging jobs to name assets; on a tag
      # push it is validated against the tag here.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "$APP_PROJECT" | head -1 | tr -d '[:space:]')
          [ -n "$VERSION" ] || { echo "cannot read <Version> from $APP_PROJECT" >&2; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG=${GITHUB_REF_NAME#v}
              [ "$TAG" = "$VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match csproj <Version>$VERSION" >&2; exit 1; }
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # The dictionary UI is CJK-heavy; without a CJK font the headless tests
      # pay a fontconfig fallback scan per glyph run (order-of-magnitude
      # slowdown, results pages re-measure after the first shaping).
      - name: Install CJK font for headless tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Run tests
        # verbosity=normal prints per-test lines: CI needs them to see progress
        # (a silent App.Tests phase is indistinguishable from a hang) and to
        # pin down slow tests; local runs stay on default verbosity.
        run: dotnet test StupidDict.slnx --logger "console;verbosity=normal"

  # Windows leg of the test suite. Covers what no other CI machine can: the
  # AutoStart registry helpers against a real HKCU (AutoStartTests early-returns
  # everywhere else), and the Windows-only file semantics documented in AGENTS.md
  # (SQLite Pooling=false file locks, reserved device names, FileStream scope
  # before move/rename/delete). Blocks packaging the same way the ubuntu leg does.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run tests
        run: dotnet test StupidDict.slnx --logger "console;verbosity=normal"

  # Packaging jobs run only on tag / manual triggers. The version comes from
  # the csproj <Version> as the single source, read once in the test job.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-windows]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # No dictionary on the runner, so package.sh skips the with-dictionary
      # variant and dictionary.zip — those live in the data-3 prerelease.
      - name: Package .app bundle
        run: scripts/package.sh --rids "osx-${{ matrix.arch }}"
      - name: Name asset with version
        run: mv dist/StupidDict-osx-${{ matrix.arch }}.zip "StupidDict-${VERSION}-osx-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: StupidDict-*-osx-*.zip
          if-no-files-found: error

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-windows]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Single net10.0 TFM: the Windows TTS fallback drives SAPI through a
      # PowerShell one-liner (System.Speech is gone). NativeAOT yields one
      # native exe — no PublishSingleFile involved.
      - name: Publish self-contained exe
        shell: pwsh
        run: >
          dotnet publish $env:APP_PROJECT -c Release -r win-x64
          --self-contained true -p:PublishAot=true
          -o "StupidDict-${env:VERSION}-win-x64"
      # NativeAOT emits a large native .pdb beside the exe. The Inno script
      # packs SourceDir\* recursively, so the pdb must be gone before ISCC
      # runs (the zip step below only picks StupidDict.exe anyway).
      - name: Remove debug symbols
        shell: pwsh
        run: Remove-Item "StupidDict-${env:VERSION}-win-x64/*.pdb" -ErrorAction SilentlyContinue
      - name: Zip portable files
        shell: pwsh
        # AOT output = exe + native libraries (e_sqlite3, libSkiaSharp); the
        # pdb is gone by now, so take the whole publish directory.
        run: Compress-Archive -Path "StupidDict-${env:VERSION}-win-x64/*" -DestinationPath "StupidDict-${env:VERSION}-win-x64.zip"
      - name: Install Inno Setup
        # Pinned to the newest 6.x (verified present in the choco feed): the
        # ISCC path below is hardcoded to "Inno Setup 6", so a future Inno 7
        # under the same choco id must not be picked up automatically. Bump
        # this pin deliberately when a new 6.x is wanted.
        run: choco install innosetup --version 6.7.1 -y --no-progress
      - name: Build setup installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION scripts\StupidDict.iss
          # 挪到仓库根：artifact 必须扁平，否则 release job 的 gh release upload dist/*
          # 会遇到目录（upload-artifact 按多路径最小公共祖先保留结构）
          Move-Item artifacts/windows/StupidDict-*-win-x64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          path: |
            StupidDict-*-win-x64.zip
            StupidDict-*-win-x64-setup.exe
          if-no-files-found: error

  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Package binary
        run: scripts/package.sh --rids linux-x64
      - name: Name asset with version
        run: mv dist/StupidDict-linux-x64.zip "StupidDict-${VERSION}-linux-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: StupidDict-*-linux-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release notes live in the repo: the notes step below reads CHANGELOG.md
      # at the tag, so this job needs a checkout (it used to only collect
      # artifacts).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      # 每个资产一份 <资产名>.sha256（sha256sum 的「hash  filename」格式）：应用内
      # 自更新在替换文件之前必须校验它。三个镜像前缀都是第三方，只靠
      # Content-Length + 魔数意味着「谁能换掉包，谁就能换掉用户的程序」。命名
      # 契约见 UpdateAssets.ChecksumAssetFileName。
      - name: Generate SHA-256 sidecars
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          ls -l *.sha256
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 段落 = `## [x.y.z]` 到下一个 `## [` 之前。release.sh 在打 tag 前已校验
          # 它存在；这里的回退只是不让漏段把已经打好的包挡在门外。
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "使用 CHANGELOG.md 的 [${VERSION}] 段（$(wc -l < release-notes.md) 行）"
          else
            echo "::warning::CHANGELOG.md 没有 [${VERSION}] 段，回退到自动生成（只含合并的 PR）"
            rm -f release-notes.md
          fi
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --generate-notes 只统计合并的 PR，直推 main 的提交会整段丢失，所以
          # Release 说明以 CHANGELOG.md 为准（v1.3.0 的碎片说明就是那条路留下的）。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            : # 已有 Release（重跑 / 人工先建）：不覆盖已有说明
          elif [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
