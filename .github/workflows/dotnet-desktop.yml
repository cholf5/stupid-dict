# CI / packaging pipeline
#
# Triggers and behavior:
#   - PR / push to main: tests only (pure doc changes like **.md, LICENSE, docs/**
#     do not trigger; tag pushes ignore paths filters and always trigger).
#   - tag v*: after tests pass, package — macOS .app (scripts/package.sh,
#     arm64+x64, self-contained), Windows win-x64 self-contained zip + Inno
#     Setup per-user installer (scripts/StupidDict.iss),
#     Linux linux-x64 zip — then create the GitHub Release and upload app
#     packages only. dictionary.zip / audio-pack.db are too big to build in
#     CI and live in their own prerelease (data-3, see ReleaseAssets.DataTag),
#     decoupled from app versions; the in-app first-run download pins to it.
#   - workflow_dispatch: manual packaging dry run (no release; artifacts on the run).
#
# Version convention: the release tag is vX.Y.Z and must equal the csproj
# <Version> of StupidDict.App (the comparison base of the in-app update
# check); scripts/release.sh bumps the csproj before tagging, and CI rejects
# a tag that disagrees.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc-only changes do not trigger tests. Path filters are not evaluated
    # for tag pushes (per GitHub docs), so sharing this block with tags is safe.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  APP_PROJECT: src/StupidDict.App/StupidDict.App.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      # csproj <Version>, used by the packaging jobs to name assets; on a tag
      # push it is validated against the tag here.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "$APP_PROJECT" | head -1 | tr -d '[:space:]')
          [ -n "$VERSION" ] || { echo "cannot read <Version> from $APP_PROJECT" >&2; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG=${GITHUB_REF_NAME#v}
              [ "$TAG" = "$VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match csproj <Version>$VERSION" >&2; exit 1; }
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # The dictionary UI is CJK-heavy; without a CJK font the headless tests
      # pay a fontconfig fallback scan per glyph run (order-of-magnitude
      # slowdown, results pages re-measure after the first shaping).
      - name: Install CJK font for headless tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Run tests
        # verbosity=normal prints per-test lines: CI needs them to see progress
        # (a silent App.Tests phase is indistinguishable from a hang) and to
        # pin down slow tests; local runs stay on default verbosity.
        run: dotnet test StupidDict.slnx --logger "console;verbosity=normal"

  # Packaging jobs run only on tag / manual triggers. The version comes from
  # the csproj <Version> as the single source, read once in the test job.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # No dictionary on the runner, so package.sh skips the with-dictionary
      # variant and dictionary.zip — those live in the data-3 prerelease.
      - name: Package .app bundle
        run: scripts/package.sh --rids "osx-${{ matrix.arch }}"
      - name: Name asset with version
        run: mv dist/StupidDict-osx-${{ matrix.arch }}.zip "StupidDict-${VERSION}-osx-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: StupidDict-*-osx-*.zip
          if-no-files-found: error

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # net10.0-windows unlocks System.Speech for the TTS fallback, matching
      # scripts/package.sh; zipped via PowerShell because Git Bash lacks zip.
      - name: Publish self-contained exe
        shell: pwsh
        run: >
          dotnet publish $env:APP_PROJECT -c Release -f net10.0-windows -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o "StupidDict-${env:VERSION}-win-x64"
      - name: Zip portable exe
        shell: pwsh
        run: Compress-Archive -Path "StupidDict-${env:VERSION}-win-x64/StupidDict.exe" -DestinationPath "StupidDict-${env:VERSION}-win-x64.zip"
      - name: Install Inno Setup
        # Pinned to the newest 6.x (verified present in the choco feed): the
        # ISCC path below is hardcoded to "Inno Setup 6", so a future Inno 7
        # under the same choco id must not be picked up automatically. Bump
        # this pin deliberately when a new 6.x is wanted.
        run: choco install innosetup --version 6.7.1 -y --no-progress
      - name: Build setup installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION scripts\StupidDict.iss
          # 挪到仓库根：artifact 必须扁平，否则 release job 的 gh release upload dist/*
          # 会遇到目录（upload-artifact 按多路径最小公共祖先保留结构）
          Move-Item artifacts/windows/StupidDict-*-win-x64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          path: |
            StupidDict-*-win-x64.zip
            StupidDict-*-win-x64-setup.exe
          if-no-files-found: error

  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Package binary
        run: scripts/package.sh --rids linux-x64
      - name: Name asset with version
        run: mv dist/StupidDict-linux-x64.zip "StupidDict-${VERSION}-linux-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: StupidDict-*-linux-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
