<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- B v4 · 层角色互换：炭黑全出血底板（浅色背景下 = 全尺寸系统圆角，治"图标显小"）+
       纸标签内缩 100（深色背景下的亮面主体，接替白边的锚点职责——亮元素从衬垫变成内容）+
       墨色呆脸（纸上的涂鸦）。几何与 v3 完全一致（同心：标签 rx 139 = 外板 239.4 − 100），
       只对调两层颜色 -->
  <rect width="1024" height="1024" fill="#2A2926"/>
  <!-- 纸标签（书票） -->
  <rect x="100" y="100" width="824" height="824" rx="139" fill="#F7F7F4"/>
  <!-- 呆脸（墨色，右眼偏小偏低，微倾） -->
  <g transform="rotate(-3 512 515)" fill="#26241E">
    <circle cx="400" cy="415" r="62"/>
    <circle cx="640" cy="442" r="48"/>
    <path d="M 470 622 L 598 606" stroke="#26241E" stroke-width="28" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 书签带（挂在标签上缘） -->
  <path d="M 690 100 H 790 V 300 L 740 244 L 690 300 Z" fill="#C4553C"/>
</svg>
