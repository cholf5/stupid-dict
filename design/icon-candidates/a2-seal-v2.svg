<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A' v2 · 朱印极简：「傻」印改篆意手绘（等宽圆笔、篆书结体），印内字面严格居中 -->
  <rect width="1024" height="1024" fill="#F7F7F4"/>
  <text x="512" y="690" text-anchor="middle" font-family="Songti SC, Noto Serif CJK SC, STSong, serif"
        font-weight="700" font-size="680" fill="#26241E">词</text>
  <rect x="742" y="742" width="164" height="164" rx="24" fill="#A8432F"/>
  <!-- 篆意「傻」：亻 + 眉/目 + 身弧 + 冫，等宽圆笔，116×116 字面盒居中于印 -->
  <g transform="translate(764,762) scale(1.08)" stroke="#F7F7F4" stroke-width="10" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <!-- 亻 -->
    <path d="M 20 8 L 20 108"/>
    <path d="M 20 32 Q 8 42 5 58"/>
    <!-- 眉（⺈） -->
    <path d="M 62 12 Q 80 2 98 12"/>
    <!-- 目 -->
    <rect x="62" y="26" width="40" height="32" rx="7"/>
    <path d="M 62 42 L 102 42"/>
    <!-- 身弧 -->
    <path d="M 54 72 Q 80 63 106 74"/>
    <!-- 冫 -->
    <path d="M 60 92 Q 57 101 61 109"/>
    <path d="M 86 92 Q 83 101 87 109"/>
  </g>
</svg>
